<style>
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .photo-grid figure { margin: 0; }
  .photo-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; display: block; }
  .photo-grid figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; text-align: center; }
  .empty-note { color: var(--muted); font-size: 14px; }
  .back-link { display: inline-block; margin-top: 4px; font-weight: 700; }
</style>
</head>

<main><section class="card">
  <a class="back-link" href="pictures.html">&larr; <span data-lang="en">Back to Pictures</span><span data-lang="yi" hidden>צוריק צו בילדער</span></a>
  <div class="photo-grid" id="photoGrid"></div>
</section></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://dzlxyglrefyzebjrlgtl.supabase.co';
  const supabaseKey = 'sb_publishable_Lz7HJgOFTKNAkjlQIhplFQ_4bIAZ3La';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

  const CATEGORY_LABELS = {
    rabbi: 'Rabbi',
    yeshiva_gedola: 'Yeshiva Gedola',
    yeshiva_ktana: 'Yeshiva Ktana',
    kiryas_joel: 'Kiryas Joel',
    monsey: 'Monsey',
    maamodim: 'מעמדים'
  };

  async function loadCategory() {
    const params = new URLSearchParams(window.location.search);
    const category = params.get('cat');
    const grid = document.getElementById('photoGrid');
    const titleEl = document.getElementById('categoryTitle');

    if (!category || !CATEGORY_LABELS[category]) {
      titleEl.textContent = 'Pictures';
      grid.innerHTML = '<p class="empty-note">No category selected.</p>';
      return;
    }

    titleEl.textContent = CATEGORY_LABELS[category];
    document.title = CATEGORY_LABELS[category] + ' | ברכת שמים קאשוי';

    const { data, error } = await supabaseClient
      .from('gallery_photos')
      .select('storage_path, caption, created_at')
      .eq('category', category)
      .order('created_at', { ascending: false });

    if (error) {
      grid.innerHTML = '<p class="empty-note">Could not load pictures: ' + error.message + '</p>';
      return;
    }

    if (!data || data.length === 0) {
      grid.innerHTML = '<p class="empty-note">No pictures yet.</p>';
      return;
    }

    grid.innerHTML = '';
    data.forEach((photo) => {
      const { data: urlData } = supabaseClient.storage.from('gallery-photos').getPublicUrl(photo.storage_path);
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      img.src = urlData.publicUrl;
      img.alt = photo.caption || '';
      img.loading = 'lazy';
      figure.appendChild(img);
      if (photo.caption) {
        const caption = document.createElement('figcaption');
        caption.textContent = photo.caption;
        figure.appendChild(caption);
      }
      grid.appendChild(figure);
    });
  }

  loadCategory();
</script>
