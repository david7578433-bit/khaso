<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
<style>
  .beis-boxes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 20px 0 8px;
  }
  .beis-box {
    display: block;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    background: var(--paper);
    border: 1px solid var(--border);
    box-shadow: 0 6px 16px rgba(30, 50, 68, .08);
    transition: transform .12s, box-shadow .12s;
  }
  .beis-box:hover,
  .beis-box:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 10px 22px rgba(30, 50, 68, .16);
  }
  .beis-box img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    background: linear-gradient(135deg, var(--navy-deep, #203447), var(--accent, #159d87) 150%);
    display: block;
    padding: 14px;
  }
  .beis-box .label {
    padding: 12px 10px;
    background: var(--navy-deep, #203447);
    color: white;
    font-weight: 700;
    text-align: center;
    font-size: 15px;
  }
  @media (max-width: 700px) {
    .beis-boxes { grid-template-columns: 1fr; }
  }
</style>
</head>
