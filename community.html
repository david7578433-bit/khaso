<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community | ברכת שמים קאשוי</title>
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
<style>
  .community-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .community-grid .card { margin:0; text-align:left; }
  .community-grid h2 { text-align:left; }
  .item { padding:12px 0; border-top:1px solid var(--border); }
  .item:first-child { border-top:0; }
  .item h3 { margin:0 0 5px; }
  .meta { color:var(--muted); font-size:14px; margin:3px 0; }
  .empty { color:var(--muted); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input { margin:0; flex:1; min-width:180px; }
  .tag { display:inline-block; background:#e7f5f2; color:var(--accent-dark); border-radius:999px; padding:3px 9px; font-size:12px; font-weight:700; }
</style>
</head>
<body data-testing-page>
<header>
  <img class="site-logo" src="logo.png" alt="ברכת שמים קאשוי">
  <h1>Community</h1>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="news.html">News</a>
  <a href="simchas.html">Simchas</a>
  <a href="community.html" aria-current="page">Community</a>
  <a href="ages.html">Ages</a>
  <a href="login.html">Log In</a>
  <button class="lang-button" type="button" onclick="toggleLang()">אידיש</button>
</nav>

<main hidden>
  <section class="card">
    <h2>Community Calendar</h2>
    <div class="toolbar"><input id="eventSearch" type="search" placeholder="Search events, places or addresses…"></div>
    <div id="eventsList"><p class="empty">Loading events…</p></div>
  </section>

  <div class="community-grid">
    <section class="card">
      <h2>Yahrzeits</h2>
      <div id="yahrzeitList"><p class="empty">Loading…</p></div>
    </section>

    <section class="card">
      <h2>Community Forms</h2>
      <div id="formsList"><p class="empty">Loading…</p></div>
    </section>

    <section class="card">
      <h2>Jobs & Opportunities</h2>
      <div id="jobsList"><p class="empty">Loading…</p></div>
    </section>

    <section class="card">
      <h2>Fundraising</h2>
      <div id="campaignsList"><p class="empty">Loading…</p></div>
    </section>

    <section class="card">
      <h2>Suggestion Box</h2>
      <p>Anyone may privately send an idea to the admins.</p>
      <form id="suggestionForm">
        <label for="suggestionBody">Your suggestion</label>
        <textarea id="suggestionBody" required maxlength="2000"></textarea>
        <button type="submit">Send Suggestion</button>
      </form>
      <p id="suggestionStatus" role="status"></p>
    </section>
  </div>
</main>

<footer>
  <a href="index.html">Home</a>
  <a href="news.html">News</a>
  <a href="simchas.html">Simchas</a>
  <a href="community.html">Community</a>
  <a href="ages.html">Ages</a>
  <a href="login.html">Log In</a>
  <button class="lang-button" type="button" onclick="toggleLang()">אידיש</button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="member-auth.js"></script>
<script>
  const communityClient = window.supabase.createClient(MEMBER_SUPABASE_URL, MEMBER_SUPABASE_KEY);
  let allEvents = [];

  function esc(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function eventDate(value) {
    if (!value) return '';
    return new Date(value).toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
  }

  function hebrewDate(value) {
    if (!value) return '';
    try { return new Intl.DateTimeFormat('he-u-ca-hebrew', {day:'numeric',month:'long',year:'numeric'}).format(new Date(value)); }
    catch (_) { return ''; }
  }

  function renderEvents(items) {
    const list = document.getElementById('eventsList');
    if (!items.length) { list.innerHTML = '<p class="empty">No upcoming events posted yet.</p>'; return; }
    list.innerHTML = items.map((item) => {
      const place = [item.location_name, item.address].filter(Boolean).join(' · ');
      return '<article class="item"><span class="tag">' + esc((item.event_type || 'event').replaceAll('_',' ')) + '</span>' +
        '<h3>' + esc(item.title) + '</h3><p class="meta">' + esc(eventDate(item.starts_at)) + (hebrewDate(item.starts_at) ? ' · ' + esc(hebrewDate(item.starts_at)) : '') + '</p>' +
        (place ? '<p class="meta">📍 ' + esc(place) + '</p>' : '') +
        (item.description ? '<p>' + esc(item.description) + '</p>' : '') +
        (item.map_url ? '<p><a href="' + esc(item.map_url) + '" target="_blank" rel="noopener">Open map</a></p>' : '') +
        '</article>';
    }).join('');
  }

  async function loadPublicContent() {
    const now = new Date().toISOString();
    const [events, yahrzeits, campaigns] = await Promise.all([
      communityClient.from('events').select('*').gte('starts_at', now).order('starts_at').limit(50),
      communityClient.from('yahrzeits').select('*').order('created_at', {ascending:false}).limit(30),
      communityClient.from('campaigns').select('*').eq('active', true).order('created_at', {ascending:false}).limit(20)
    ]);
    allEvents = events.data || [];
    renderEvents(allEvents);

    const yList = document.getElementById('yahrzeitList');
    yList.innerHTML = (yahrzeits.data || []).map((item) => '<article class="item"><h3>' + esc(item.name) + '</h3><p class="meta">' + esc(item.hebrew_date) + '</p>' + (item.notes ? '<p>' + esc(item.notes) + '</p>' : '') + '</article>').join('') || '<p class="empty">No yahrzeits posted.</p>';

    const cList = document.getElementById('campaignsList');
    cList.innerHTML = (campaigns.data || []).map((item) => '<article class="item"><h3>' + esc(item.title) + '</h3>' + (item.description ? '<p>' + esc(item.description) + '</p>' : '') + (item.goal ? '<p class="meta">Goal: $' + esc(Number(item.goal).toLocaleString()) + '</p>' : '') + (item.donation_url ? '<a class="button" href="' + esc(item.donation_url) + '" target="_blank" rel="noopener">Donate Securely</a>' : '') + '</article>').join('') || '<p class="empty">No active campaigns.</p>';
  }

  async function loadMemberContent() {
    const { session, profile } = await getMemberStatus();
    if (!session || !profile || !profile.approved) return;

    const [forms, jobs] = await Promise.all([
      communityClient.from('community_forms').select('*').eq('active', true).order('created_at', {ascending:false}),
      communityClient.from('jobs').select('*').eq('approved', true).order('created_at', {ascending:false})
    ]);
    document.getElementById('formsList').innerHTML = (forms.data || []).map((item) => '<article class="item"><h3>' + esc(item.title) + '</h3>' + (item.description ? '<p>' + esc(item.description) + '</p>' : '') + '<a href="' + esc(item.file_url) + '" target="_blank" rel="noopener">Open / Download</a></article>').join('') || '<p class="empty">No forms posted.</p>';
    document.getElementById('jobsList').innerHTML = (jobs.data || []).map((item) => '<article class="item"><h3>' + esc(item.title) + '</h3>' + (item.description ? '<p>' + esc(item.description) + '</p>' : '') + (item.location ? '<p class="meta">📍 ' + esc(item.location) + '</p>' : '') + (item.contact ? '<p class="meta">Contact: ' + esc(item.contact) + '</p>' : '') + '</article>').join('') || '<p class="empty">No jobs posted.</p>';

  }

  document.getElementById('suggestionForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const body = document.getElementById('suggestionBody').value.trim();
    const status = document.getElementById('suggestionStatus');
    if (!body) return;
    status.textContent = 'Sending…';
    const { data: { session } } = await communityClient.auth.getSession();
    const suggestion = { body };
    if (session && session.user) suggestion.sender_id = session.user.id;
    const result = await communityClient.from('suggestions').insert(suggestion);
    if (result.error) status.textContent = 'Could not send: ' + result.error.message;
    else { event.target.reset(); status.textContent = 'Suggestion sent privately to the admins.'; }
  });

  document.getElementById('eventSearch').addEventListener('input', (event) => {
    const query = event.target.value.trim().toLowerCase();
    renderEvents(!query ? allEvents : allEvents.filter((item) => [item.title,item.description,item.location_name,item.address,item.event_type].some((value) => String(value || '').toLowerCase().includes(query))));
  });

  loadPublicContent();
  loadMemberContent();
</script>
</body>
</html>
