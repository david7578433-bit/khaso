<main>
  <section class="card">
    <p data-lang="en">Welcome to ברכת שמים קאשוי.</p>
    <p data-lang="yi" hidden>ברוכים הבאים צו ברכת שמים קאשוי.</p>
  </section>

  <section id="announcement" class="card announcement" hidden aria-live="polite" dir="auto">
    <h2 id="announcementTitle"></h2>
    <p id="announcementContent"></p>
  </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://dzlxyglrefyzebjrlgtl.supabase.co';
  const supabaseKey = 'sb_publishable_Lz7HJgOFTKNAkjlQIhplFQ_4bIAZ3La';
  const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

async function loadAnnouncement() {
  const { data, error } = await supabaseClient
    .from('announcements')
    .select('title, content, created_at')
    .order('created_at', { ascending: false })
    .limit(1);

  if (error) {
    console.error('Could not load announcement:', error.message);
    return;
  }

  if (data && data.length > 0) {
    document.getElementById('announcementTitle').textContent = data[0].title || '';
    document.getElementById('announcementContent').textContent = data[0].content || '';
    document.getElementById('announcement').hidden = false;
  }
}

  loadAnnouncement();
</script>

  <a class="admin-link" href="admin.html">Admin</a>
