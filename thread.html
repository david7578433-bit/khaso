<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Thread | Kasho</title>
<link rel="stylesheet" href="style.css">
<script src="site.js?v=20260901-2" defer></script>
<style>
  body { background:#f4f7f8; }
  main { width:min(900px,100%); margin:auto; padding-top:24px; }
  .thread-page { padding:0; overflow:hidden; text-align:left; }
  .thread-page-header { display:flex; align-items:center; gap:14px; padding:16px 20px; border-bottom:1px solid var(--border); color:var(--ink); background:white; text-align:left; }
  .thread-page-header a { display:inline-flex; align-items:center; min-height:40px; padding:7px 12px; border-radius:9px; color:var(--ink); background:#eef2f5; font-weight:700; text-decoration:none; }
  .thread-page-header h1 { margin:0; font:800 22px/1.2 "Assistant","Segoe UI",sans-serif; }
  .thread-root-card { margin:18px; padding:16px 18px; border-radius:14px; background:#e6f1ef; }
  .thread-root-card strong,.thread-reply strong { display:block; }
  .thread-root-card p,.thread-reply p { margin:5px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .thread-root-card small,.thread-reply small { color:var(--muted); }
  .thread-replies { display:flex; min-height:180px; max-height:55vh; overflow-y:auto; flex-direction:column; gap:10px; padding:0 18px 18px; }
  .thread-reply { padding:13px 15px; border:1px solid var(--border); border-radius:13px; background:white; }
  .thread-empty { color:var(--muted); text-align:center; padding:30px; }
  .thread-page-form { display:flex; gap:9px; align-items:flex-end; padding:14px 18px 18px; border-top:1px solid var(--border); background:white; }
  .thread-page-form textarea { flex:1; min-height:46px; max-height:130px; margin:0; resize:none; }
  .thread-page-form button { min-height:46px; }
  #threadStatus { min-height:22px; margin:0; padding:0 18px 14px; color:var(--muted); }
  @media (max-width:620px) { main { padding:10px 8px 30px; } .thread-page-header { padding-left:60px; } .thread-page-form { flex-wrap:wrap; } .thread-page-form button { width:100%; } }
</style>
</head>
<body>
<main>
  <section class="card thread-page">
    <header class="thread-page-header">
      <a id="backToChat" href="ages.html">← Back to chat</a>
      <h1>Thread</h1>
    </header>
    <div id="threadRoot" class="thread-root-card"><p>Loading thread…</p></div>
    <div id="threadReplies" class="thread-replies"></div>
    <form id="threadPageForm" class="thread-page-form" hidden>
      <textarea id="threadPageBody" maxlength="4000" placeholder="Reply in thread…" required></textarea>
      <button type="submit">Send reply</button>
    </form>
    <p id="threadStatus" role="status" aria-live="polite"></p>
  </section>
</main>

<footer>
  <a href="index.html">Home</a>
  <a href="ages.html">Kasho Chat</a>
  <a href="login.html">Account</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="member-auth.js"></script>
<script>
  let rootPost = null;
  let currentUserId = null;
  let threadChannel = null;
  const postId = new URLSearchParams(location.search).get('post');

  function nameFor(profile) {
    if (!profile) return 'Member';
    return profile.display_name || [profile.first_name,profile.last_name].filter(Boolean).join(' ') || 'Member';
  }
  function parseBody(body) {
    try { const parsed=JSON.parse(body);return parsed&&typeof parsed==='object'?parsed:{text:String(body||'')}; }
    catch (_) { return {text:String(body||'')}; }
  }
  function makeMessage(profile,body,createdAt,className) {
    const parsed=parseBody(body);const card=document.createElement('article');card.className=className;
    const name=document.createElement('strong');name.textContent=nameFor(profile);const text=document.createElement('p');text.textContent=parsed.text||parsed.sticker||((parsed.attachments||[]).length?'Attachment':'Message');const time=document.createElement('small');time.textContent=new Date(createdAt).toLocaleString();
    card.appendChild(name);card.appendChild(text);card.appendChild(time);return card;
  }
  async function loadThread(preserveScroll) {
    const replies=document.getElementById('threadReplies');const nearBottom=replies.scrollHeight-replies.scrollTop-replies.clientHeight<80;
    const rootResult=await memberClient.from('posts').select('id,topic_id,author_id,body,created_at,profiles(display_name,first_name,last_name)').eq('id',postId).maybeSingle();
    if(rootResult.error||!rootResult.data){document.getElementById('threadRoot').innerHTML='<p>This thread could not be found or you do not have access.</p>';return;}
    rootPost=rootResult.data;document.getElementById('backToChat').href='ages.html?topic='+encodeURIComponent(rootPost.topic_id);const root=document.getElementById('threadRoot');root.innerHTML='';root.appendChild(makeMessage(rootPost.profiles,rootPost.body,rootPost.created_at,'thread-root-message'));
    const result=await memberClient.from('posts').select('id,body,created_at,profiles(display_name,first_name,last_name)').eq('reply_to_id',postId).order('created_at');
    replies.innerHTML='';(result.data||[]).forEach((reply)=>replies.appendChild(makeMessage(reply.profiles,reply.body,reply.created_at,'thread-reply')));if(!(result.data||[]).length)replies.innerHTML='<p class="thread-empty">No replies yet.</p>';
    if(!preserveScroll||nearBottom)replies.scrollTop=replies.scrollHeight;
  }
  document.getElementById('threadPageForm').addEventListener('submit',async(event)=>{
    event.preventDefault();const field=document.getElementById('threadPageBody');const text=field.value.trim();if(!text||!rootPost)return;const status=document.getElementById('threadStatus');status.textContent='Sending…';
    const result=await memberClient.from('posts').insert({topic_id:rootPost.topic_id,author_id:currentUserId,body:JSON.stringify({text,attachments:[],sticker:null}),reply_to_id:rootPost.id});
    if(result.error){status.textContent='Could not send: '+result.error.message;return;}field.value='';status.textContent='';await loadThread();
  });
  document.getElementById('threadPageBody').addEventListener('keydown',(event)=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.getElementById('threadPageForm').requestSubmit();}});
  (async()=>{
    const status=await getMemberStatus();if(!status.session){location.href='login.html';return;}if(!status.profile||!status.profile.approved){document.getElementById('threadRoot').innerHTML='<p>Your account must be approved before you can open chat threads.</p>';return;}if(!postId){document.getElementById('threadRoot').innerHTML='<p>No thread was selected.</p>';return;}
    currentUserId=status.session.user.id;document.getElementById('threadPageForm').hidden=false;await loadThread();
    threadChannel=memberClient.channel('kasho-thread-'+postId).on('postgres_changes',{event:'*',schema:'public',table:'posts'},(change)=>{const row=change.new||change.old||{};if(String(row.reply_to_id)===String(postId)||String(row.id)===String(postId))loadThread(true);}).subscribe();
  })();
</script>
</body>
</html>
