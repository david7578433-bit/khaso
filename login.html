<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In | ברכת שמים קאשוי</title>
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>

<header>
  <img class="site-logo" src="logo.png" alt="ברכת שמים קאשוי">
  <h1 data-lang="en">Members Log In</h1>
  <h1 data-lang="yi" hidden>מעמבערס לאגין</h1>
</header>

<nav>
  <a href="index.html"><span data-lang="en">Home</span><span data-lang="yi" hidden>היים</span></a>
  <a href="about.html"><span data-lang="en">About</span><span data-lang="yi" hidden>וועגן אונדז</span></a>
  <a href="contact.html"><span data-lang="en">Contact</span><span data-lang="yi" hidden>קאנטאקט</span></a>
  <a href="yeshiva.html"><span data-lang="en">Yeshiva</span><span data-lang="yi" hidden>ישיבה</span></a>
  <a href="botei-medrash.html"><span data-lang="en">Botei Medrash</span><span data-lang="yi" hidden>בתי מדרשים</span></a>
  <a href="ages.html">Ages</a>
  <a href="login.html" aria-current="page"><span data-lang="en">Log In</span><span data-lang="yi" hidden>לאגין</span></a>
  <button class="lang-button" type="button" onclick="toggleLang()">יידיש</button>
</nav>

<main>
  <section class="card">
    <div id="signedOutView">
      <p>Sign in to take part in member discussions and share pictures.</p>
      <button type="button" onclick="signInWithGoogle('login.html')">Sign in with Google</button>
    </div>

    <div id="pendingView" hidden>
      <p>You're signed in. Your account is waiting to be approved — check back soon.</p>
      <button type="button" class="secondary" onclick="signOutMember()">Log Out</button>
    </div>

    <div id="approvedView" hidden>
      <p>You're signed in and approved.</p>
      <button type="button" class="secondary" onclick="signOutMember()">Log Out</button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
  </section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="member-auth.js"></script>
<script>
  (async () => {
    const statusEl = document.getElementById('status');
    statusEl.textContent = 'Checking sign-in status…';

    const { session, profile } = await getMemberStatus();

    document.getElementById('signedOutView').hidden = !!session;
    document.getElementById('pendingView').hidden = !(session && profile && !profile.approved);
    document.getElementById('approvedView').hidden = !(session && profile && profile.approved);
    statusEl.textContent = '';
  })();
</script>
</main>
</body>
</html>
