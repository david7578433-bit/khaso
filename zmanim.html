<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Zmanim | ברכת שמים קאשוי</title>
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
<style>
  .zmanim-card { max-width:760px; margin:25px auto; text-align:left; }
  .zmanim-locations { display:flex; gap:8px; flex-wrap:wrap; margin:15px 0; }
  .zmanim-locations .button { border:0; cursor:pointer; font-family:inherit; }
  .zmanim-locations .button[aria-pressed="true"] { outline:3px solid rgba(16,135,126,.25); background:var(--accent-dark); }
  .location-button { background:#214e67; }
  .location-status { color:var(--muted); font-size:14px; }
  .zmanim-list { border-top:1px solid var(--border); margin-top:12px; }
  .zman-row { display:flex; justify-content:space-between; gap:15px; padding:9px 0; border-bottom:1px solid var(--border); }
  .zman-row strong { white-space:nowrap; }
</style>
</head>
<body>
<header>
  <img class="site-logo" src="./logo.png?v=2" alt="ברכת שמים קאשוי">
  <h1><span data-lang="en">Daily Zmanim</span><span data-lang="yi" hidden>טעגליכע זמנים</span></h1>
</header>
<nav>
  <a href="index.html">Home</a>
  <a href="news.html">News</a>
  <a href="simchas.html">Simchas</a>
  <a href="zmanim.html" aria-current="page">Zmanim</a>
  <a href="login.html">Log In</a>
  <button class="lang-button" type="button" onclick="toggleLang()">אידיש</button>
</nav>

<main>
  <section class="card zmanim-card">
    <h2>Today's Zmanim</h2>
    <p>Choose a city, or allow your exact current location.</p>
    <button class="button location-button" id="useLocation" type="button">📍 Use My Exact Location</button>
    <button class="button" id="forgetLocation" type="button" hidden>Forget Saved Location</button>
    <p class="location-status" id="locationStatus">Your last location can be saved in this browser for future visits.</p>
    <div class="zmanim-locations" aria-label="Choose a zmanim location">
      <button class="button zmanim-location" type="button" data-location="kiryas_joel" aria-pressed="true">Kiryas Joel</button>
      <button class="button zmanim-location" type="button" data-location="monsey" aria-pressed="false">Monsey</button>
      <button class="button zmanim-location" type="button" data-location="williamsburg" aria-pressed="false">Williamsburg</button>
      <button class="button zmanim-location" type="button" data-location="boro_park" aria-pressed="false">Boro Park</button>
      <button class="button zmanim-location" type="button" data-location="crown_heights" aria-pressed="false">Crown Heights</button>
      <button class="button zmanim-location" type="button" data-location="lakewood" aria-pressed="false">Lakewood</button>
      <button class="button zmanim-location" type="button" data-location="new_square" aria-pressed="false">New Square</button>
    </div>
    <p class="location-status" id="zmanimDate"></p>
    <div class="zmanim-list" id="zmanimList"><p>Loading today's zmanim…</p></div>
    <p class="location-status">Times provided by <a href="https://www.hebcal.com/home/1663/zmanim-halachic-times-api" target="_blank" rel="noopener">Hebcal Zmanim</a>.</p>
  </section>
</main>

<footer>
  <a href="index.html">Home</a>
  <a href="news.html">News</a>
  <a href="simchas.html">Simchas</a>
  <a href="zmanim.html">Zmanim</a>
  <a href="login.html">Log In</a>
  <button class="lang-button" type="button" onclick="toggleLang()">אידיש</button>
</footer>

<script>
  const locations = {
    kiryas_joel: { name:'Kiryas Joel', zip:'10950' },
    monsey: { name:'Monsey', zip:'10952' },
    williamsburg: { name:'Williamsburg', zip:'11211' },
    boro_park: { name:'Boro Park', zip:'11219' },
    crown_heights: { name:'Crown Heights', zip:'11213' },
    lakewood: { name:'Lakewood', zip:'08701' },
    new_square: { name:'New Square', zip:'10977' }
  };
  const SAVED_LOCATION_KEY = 'khaso_last_zmanim_location';

  function esc(value) {
    const div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  function localDate(timeZone) {
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
      timeZone, year:'numeric', month:'2-digit', day:'2-digit'
    }).formatToParts(new Date()).filter((part) => part.type !== 'literal').map((part) => [part.type, part.value]));
    return parts.year + '-' + parts.month + '-' + parts.day;
  }

  function formatZman(value, timeZone) {
    if (!value) return '—';
    return new Date(value).toLocaleTimeString('en-US', { timeZone, hour:'numeric', minute:'2-digit' });
  }

  function renderTimes(data, label, timeZone, date) {
    const times = data.times || {};
    const rows = [
      ['Alos HaShachar', times.alotHaShachar],
      ['Sunrise', times.sunrise],
      ['Latest Shema (MGA)', times.sofZmanShmaMGA],
      ['Latest Shema (GRA)', times.sofZmanShma],
      ['Latest Shacharis', times.sofZmanTfilla],
      ['Chatzos', times.chatzot],
      ['Mincha Gedola', times.minchaGedola],
      ['Plag HaMincha', times.plagHaMincha],
      ['Shkiah', times.sunset],
      ['Tzeis (72 minutes)', times.tzeit72min]
    ];
    document.getElementById('zmanimDate').textContent = label + ' · ' + new Date(date + 'T12:00:00').toLocaleDateString('en-US', { dateStyle:'long' });
    document.getElementById('zmanimList').innerHTML = rows.map((row) => '<div class="zman-row"><span>' + esc(row[0]) + '</span><strong>' + esc(formatZman(row[1], timeZone)) + '</strong></div>').join('');
  }

  async function requestZmanim(url, label, timeZone, date) {
    const list = document.getElementById('zmanimList');
    list.innerHTML = '<p>Loading today\'s zmanim…</p>';
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('service unavailable');
      renderTimes(await response.json(), label, timeZone, date);
    } catch (_) {
      list.innerHTML = '<p>Could not load today\'s zmanim. Please try again shortly.</p>';
    }
  }

  function loadCity(key) {
    const place = locations[key];
    const timeZone = 'America/New_York';
    const date = localDate(timeZone);
    document.querySelectorAll('.zmanim-location').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.location === key)));
    requestZmanim('https://www.hebcal.com/zmanim?cfg=json&zip=' + encodeURIComponent(place.zip) + '&date=' + date, place.name, timeZone, date);
  }

  async function loadExactLocation(saved) {
    const latitude = Number(saved.latitude);
    const longitude = Number(saved.longitude);
    const timeZone = saved.timeZone || Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/New_York';
    const date = localDate(timeZone);
    document.querySelectorAll('.zmanim-location').forEach((button) => button.setAttribute('aria-pressed', 'false'));
    document.getElementById('forgetLocation').hidden = false;
    document.getElementById('locationStatus').innerHTML = 'Saved location: ' + esc(latitude.toFixed(5)) + ', ' + esc(longitude.toFixed(5)) +
      ' · <a href="https://www.google.com/maps?q=' + encodeURIComponent(latitude + ',' + longitude) + '" target="_blank" rel="noopener">View on map</a>. Saved only in this browser.';
    const url = 'https://www.hebcal.com/zmanim?cfg=json&latitude=' + encodeURIComponent(latitude) + '&longitude=' + encodeURIComponent(longitude) + '&tzid=' + encodeURIComponent(timeZone) + '&date=' + date;
    await requestZmanim(url, 'Your saved location', timeZone, date);
  }

  document.querySelectorAll('.zmanim-location').forEach((button) => button.addEventListener('click', () => loadCity(button.dataset.location)));

  document.getElementById('useLocation').addEventListener('click', () => {
    const status = document.getElementById('locationStatus');
    if (!navigator.geolocation) { status.textContent = 'This browser cannot provide your location.'; return; }
    status.textContent = 'Waiting for location permission…';
    navigator.geolocation.getCurrentPosition(async (position) => {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/New_York';
      const saved = { latitude, longitude, timeZone, savedAt:new Date().toISOString() };
      localStorage.setItem(SAVED_LOCATION_KEY, JSON.stringify(saved));
      await loadExactLocation(saved);
    }, (error) => {
      status.textContent = error.code === 1 ? 'Location permission was not allowed. Choose a city below.' : 'Could not find your location. Choose a city below.';
    }, { enableHighAccuracy:true, timeout:12000, maximumAge:300000 });
  });

  document.getElementById('forgetLocation').addEventListener('click', () => {
    localStorage.removeItem(SAVED_LOCATION_KEY);
    document.getElementById('forgetLocation').hidden = true;
    document.getElementById('locationStatus').textContent = 'Saved location removed. Choose a city or use your exact location again.';
    loadCity('kiryas_joel');
  });

  try {
    const savedLocation = JSON.parse(localStorage.getItem(SAVED_LOCATION_KEY));
    if (savedLocation && Number.isFinite(Number(savedLocation.latitude)) && Number.isFinite(Number(savedLocation.longitude))) loadExactLocation(savedLocation);
    else loadCity('kiryas_joel');
  } catch (_) {
    loadCity('kiryas_joel');
  }
</script>
</body>
</html>
