<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ages | ברכת שמים קאשוי</title>
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
<style>
  .topic-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .topic-list button { background: #607d9a; }
  .topic-list button.active { background: var(--accent); }
  .post { text-align: left; padding: 14px 0; border-top: 1px solid var(--border); }
  .post:first-child { border-top: 0; }
  .post-meta { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .post-body { margin: 0; white-space: pre-wrap; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
  .photo-grid img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <img class="site-logo" src="logo.png" alt="ברכת שמים קאשוי">
  <h1>Ages</h1>
</header>

<nav>
  <a href="index.html"><span data-lang="en">Home</span><span data-lang="yi" hidden>היים</span></a>
  <a href="about.html"><span data-lang="en">About</span><span data-lang="yi" hidden>וועגן אונדז</span></a>
  <a href="contact.html"><span data-lang="en">Contact</span><span data-lang="yi" hidden>קאנטאקט</span></a>
  <a href="yeshiva.html"><span data-lang="en">Yeshiva</span><span data-lang="yi" hidden>ישיבה</span></a>
  <a href="botei-medrash.html"><span data-lang="en">Botei Medrash</span><span data-lang="yi" hidden>בתי מדרשים</span></a>
  <a href="ages.html" aria-current="page">Ages</a>
  <a href="login.html">Log In</a>
  <button class="lang-button" type="button" onclick="toggleLang()">יידיש</button>
</nav>

<main>
  <section class="card" id="gateCard">
    <p id="gateMessage">Checking your account…</p>
    <button id="gateSignIn" type="button" hidden onclick="signInWithGoogle('ages.html')">Sign in with Google</button>
  </section>

  <section class="card" id="boardCard" hidden>
    <h2>Discussion</h2>
    <div class="topic-list" id="topicList"></div>
    <div id="postList"></div>
    <form id="postForm">
      <label for="postBody">Add to the discussion</label>
      <textarea id="postBody" required></textarea>
      <button type="submit">Post</button>
    </form>
    <p id="boardStatus" role="status" aria-live="polite"></p>
  </section>

  <section class="card" id="photoCard" hidden>
    <h2>Pictures</h2>
    <p>Uploaded pictures appear here once an admin approves them.</p>
    <div class="photo-grid" id="photoGrid"></div>
    <form id="uploadForm">
      <label for="photoFile">Upload a picture</label>
      <input type="file" id="photoFile" accept="image/*" required>
      <label for="photoCaption">Caption (optional)</label>
      <input type="text" id="photoCaption" maxlength="200">
      <button type="submit">Upload</button>
    </form>
    <p id="uploadStatus" role="status" aria-live="polite"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="member-auth.js"></script>
<script>
  let currentTopicId = null;

  async function loadTopics() {
    const { data, error } = await memberClient.from('topics').select('id, title').order('id');
    const list = document.getElementById('topicList');
    list.innerHTML = '';
    if (error || !data || data.length === 0) return;

    data.forEach((topic, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = topic.title;
      button.addEventListener('click', () => selectTopic(topic.id, button));
      list.appendChild(button);
      if (index === 0) selectTopic(topic.id, button);
    });
  }

  function selectTopic(topicId, button) {
    currentTopicId = topicId;
    document.querySelectorAll('#topicList button').forEach((b) => b.classList.remove('active'));
    button.classList.add('active');
    loadPosts();
  }

  async function loadPosts() {
    const postList = document.getElementById('postList');
    postList.innerHTML = 'Loading…';
    if (currentTopicId === null) { postList.innerHTML = ''; return; }

    const { data, error } = await memberClient
      .from('posts')
      .select('id, body, created_at, profiles(display_name)')
      .eq('topic_id', currentTopicId)
      .order('created_at', { ascending: true });

    if (error) {
      postList.innerHTML = 'Could not load posts: ' + error.message;
      return;
    }

    postList.innerHTML = '';
    if (!data || data.length === 0) {
      postList.innerHTML = '<p class="post">No posts yet — be the first.</p>';
      return;
    }

    data.forEach((post) => {
      const div = document.createElement('div');
      div.className = 'post';
      const meta = document.createElement('p');
      meta.className = 'post-meta';
      meta.textContent = (post.profiles && post.profiles.display_name ? post.profiles.display_name : 'Member')
        + ' · ' + new Date(post.created_at).toLocaleString();
      const body = document.createElement('p');
      body.className = 'post-body';
      body.textContent = post.body;
      div.appendChild(meta);
      div.appendChild(body);
      postList.appendChild(div);
    });
  }

  document.getElementById('postForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const statusEl = document.getElementById('boardStatus');
    const bodyField = document.getElementById('postBody');
    if (currentTopicId === null) { statusEl.textContent = 'Pick a topic first.'; return; }

    const { data: { session } } = await memberClient.auth.getSession();
    statusEl.textContent = 'Posting…';

    const { error } = await memberClient.from('posts').insert({
      topic_id: currentTopicId,
      author_id: session.user.id,
      body: bodyField.value.trim()
    });

    if (error) {
      statusEl.textContent = 'Could not post: ' + error.message;
      return;
    }

    bodyField.value = '';
    statusEl.textContent = '';
    await loadPosts();
  });

  async function loadPhotos() {
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = '';
    const { data, error } = await memberClient
      .from('photo_uploads')
      .select('id, storage_path, caption')
      .eq('status', 'approved')
      .order('created_at', { ascending: false });

    if (error || !data) return;

    data.forEach((photo) => {
      const { data: urlData } = memberClient.storage.from('community-photos').getPublicUrl(photo.storage_path);
      const img = document.createElement('img');
      img.src = urlData.publicUrl;
      img.alt = photo.caption || '';
      grid.appendChild(img);
    });
  }

  document.getElementById('uploadForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const statusEl = document.getElementById('uploadStatus');
    const fileInput = document.getElementById('photoFile');
    const captionInput = document.getElementById('photoCaption');
    const file = fileInput.files[0];
    if (!file) return;

    const { data: { session } } = await memberClient.auth.getSession();
    statusEl.textContent = 'Uploading…';

    const path = session.user.id + '/' + Date.now() + '-' + file.name;
    const { error: uploadError } = await memberClient.storage.from('community-photos').upload(path, file);
    if (uploadError) {
      statusEl.textContent = 'Could not upload: ' + uploadError.message;
      return;
    }

    const { error: insertError } = await memberClient.from('photo_uploads').insert({
      uploader_id: session.user.id,
      storage_path: path,
      caption: captionInput.value.trim() || null
    });

    if (insertError) {
      statusEl.textContent = 'Could not save: ' + insertError.message;
      return;
    }

    fileInput.value = '';
    captionInput.value = '';
    statusEl.textContent = 'Uploaded — waiting for admin approval.';
  });

  (async () => {
    const { session, profile } = await getMemberStatus();
    const gateCard = document.getElementById('gateCard');
    const gateMessage = document.getElementById('gateMessage');
    const gateSignIn = document.getElementById('gateSignIn');
    const boardCard = document.getElementById('boardCard');
    const photoCard = document.getElementById('photoCard');

    if (!session) {
      gateMessage.textContent = 'Sign in to join the discussion.';
      gateSignIn.hidden = false;
      return;
    }

    if (!profile || !profile.approved) {
      gateMessage.textContent = "You're signed in. Your account is waiting for approval — check back soon.";
      return;
    }

    gateCard.hidden = true;
    boardCard.hidden = false;
    photoCard.hidden = false;
    await loadTopics();
    await loadPhotos();
  })();
</script>
</body>
</html>
